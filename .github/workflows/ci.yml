name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build QEMU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev libslirp-dev \
            python3 python3-venv git gcc-arm-linux-gnueabi libc6-dev-armel-cross \
            python3-pil ffmpeg

      - name: Build QEMU
        run: bash qemu/setup.sh

      - name: Build IVE test initramfs
        run: |
          arm-linux-gnueabi-gcc -static -O2 -o /tmp/test-ive-init \
            qemu-boot/test-ive-ops.c
          mkdir -p /tmp/initramfs
          cp /tmp/test-ive-init /tmp/initramfs/init
          (cd /tmp/initramfs && echo init | cpio -o -H newc) > qemu-boot/test-ive.cpio

      - name: Verify machines
        run: |
          count=$(./qemu-src/build/qemu-system-arm -machine help | grep -cE '(hi35|gk7)')
          echo "Registered machines: $count"
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '(hi35|gk7)'
          [ "$count" -ge 21 ]
          # aarch64 V5 machines (Hi3519DV500 / Hi3516DV500)
          ./qemu-src/build/qemu-system-aarch64 -machine help | grep -E 'hi3519dv500|hi3516dv500'
          # Xiongmai family (hw/arm/xiongmai.c), not HiSilicon-derived
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^xm510 '
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^xm530 '
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^xm550 '
          # Goke GK7101/GK7102 (hw/arm/goke.c), Goke's own Ambarella-IP design
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^gk7101 '
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^gk7102 '
          # SigmaStar infinity2m (hw/arm/sigmastar.c)
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^ssr621q '
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^ssd202d '
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^ssd201 '
          # Novatek NT9856x (hw/arm/novatek.c)
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^nt98562 '
          ./qemu-src/build/qemu-system-arm -machine help | grep -E '^nt98566 '

      - name: SPI-NAND erase/program addressing (hisi-fmc)
        run: bash qemu/tests/test-hisi-fmc-nand-erase.sh

      - name: CPU1 release via CRG soft-reset (hisi-crg, -bios path)
        run: bash qemu/tests/test-hisi-smp-release.sh

      - name: V1 DDR needs the reg_info table (hisi-ddrc-v1, flash boot)
        run: bash qemu/tests/test-hisi-v1-ddr-init.sh

      # The Hantro H1 driven over qtest the way mainline Linux's
      # hantro_h1_jpeg_enc.c drives it; the JPEG must decode and match
      # libjpeg's encode of the same frame.
      - name: Hantro H1 JPEG encode (xm-h1)
        run: python3 qemu/tests/test-xm-h1-jpeg.py

      # H.264 the way Hantro's library drives it: majestic's own SPS/PPS
      # ahead of the output, the header remainder in STR_HDR_REM; ffmpeg must
      # decode every frame.
      - name: Hantro H1 H.264 encode (xm-h1)
        run: python3 qemu/tests/test-xm-h1-h264.py

      # The XM530 pad controller as the gpio-xm530 kernel driver and the
      # vendor ISP drive it: output levels, input lines, mux bits kept.
      - name: XM530 pad GPIO (xm-gpio)
        run: python3 qemu/tests/test-xm-gpio.py

      # XM510's banked GPIO: data/output enable per port, muxed pins idle.
      - name: XM510 GPIO (xm510-gpio)
        run: python3 qemu/tests/test-xm510-gpio.py

      # The XM510/XM530 watchdog: SP805 identity, so Linux's sp805_wdt
      # binds; fed it stays armed, unfed it resets the machine.
      - name: XM SP805 watchdog (arm-sp805)
        run: python3 qemu/tests/test-xm-sp805.py

      # The GK710x models driven over qtest at the silicon addresses the
      # vendor HAL drives: boot-ROM header, SPI-NOR byte order and
      # write-back, timer edge into the VIC, I2C to a sensor, watchdog.
      # Boot tests need the vendor HAL, which is not redistributable.
      - name: Goke GK710x devices (gk-sflash, gk-vic, gk-idc, ...)
        run: python3 qemu/tests/test-gk710x.py

      # The GK7102S / GK7102C machine: the same models in the S register
      # layouts the vendor drivers use directly (gk-remap), its boot
      # header, and the DMA controller the GK7102C U-Boot checks.
      - name: Goke GK710xS devices (gk-remap, gk-dma)
        run: python3 qemu/tests/test-gk710xs.py

      # The Anyka AK39xx models driven over qtest the way the vendor drivers
      # drive them: mask-ROM staging of the boot header, timer into the
      # two-level interrupt controller, UART and SPI through L2 memory
      # (PIO and DMA), SPI-NOR write-back, both I2C layouts, the GMAC's
      # PHY and 24-byte descriptor ring, an empty SD slot.  Boot tests
      # need camera dumps, which are vendor firmware.
      - name: Anyka AK39xx devices (ak-sysctrl, ak-l2, ak-spi, ...)
        run: python3 qemu/tests/test-anyka.py

      # The SigmaStar infinity2m models driven over qtest the way the vendor
      # IPL, U-Boot and kernel drive them: mask-ROM staging of the IPL, RIU
      # storage and boot status bits, timers into the main-intc, the FSP's
      # three-command sequences and the BDMA page program written back to
      # the image, the EMAC's 16-bit halves and a frame on the wire, EHCI
      # through the halves with a USB keyboard, AHCI with a disk, GE and
      # vsync.  Boot tests need an NVR flash dump, which is vendor firmware.
      - name: SigmaStar infinity2m devices (sstar-fsp, sstar-emac, ...)
        run: python3 qemu/tests/test-sigmastar.py

      # The Novatek NT9856x models driven over qtest the way the vendor
      # kernel drives them: chip ID, the CG PLL8 rate periph_clk comes from,
      # the keyed watchdog (interrupt, reset, the kernel's manual reset),
      # GPIO pads and both interrupt kinds, the RTC's CSET handshake and its
      # power-off-with-alarm reboot, and the device tree the machine builds.
      - name: Novatek NT9856x devices (nvt-top, nvt-cg, nvt-rtc, ...)
        run: python3 qemu/tests/test-novatek.py

      - name: Upload QEMU binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/qemu-system-arm
          retention-days: 1

      - name: Upload IVE test initramfs
        uses: actions/upload-artifact@v4
        with:
          name: ive-test-cpio
          path: qemu-boot/test-ive.cpio
          retention-days: 1

  ive-test:
    name: IVE register tests (19 ops)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfdt1 libglib2.0-0 libpixman-1-0 libslirp0 dnsmasq-base

      - name: Download QEMU binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/

      - name: Download IVE test initramfs
        uses: actions/download-artifact@v4
        with:
          name: ive-test-cpio
          path: qemu-boot/

      - name: Make QEMU executable
        run: chmod +x qemu-src/build/qemu-system-arm

      - name: Download EV300 kernel
        run: |
          cd qemu-boot
          curl -sL "https://github.com/OpenIPC/firmware/releases/download/latest/openipc.hi3516ev300-nor-lite.tgz" \
              -o openipc.hi3516ev300-nor-lite.tgz
          tar xzf openipc.hi3516ev300-nor-lite.tgz

      - name: Run IVE register-level tests
        timeout-minutes: 2
        run: |
          timeout 60 ./qemu-src/build/qemu-system-arm \
            -M hi3516ev300 \
            -kernel qemu-boot/uImage.hi3516ev300 \
            -initrd qemu-boot/test-ive.cpio \
            -nographic -serial mon:stdio \
            -append "console=ttyAMA0,115200" \
            2>&1 | tee ive-output.txt || true

          echo ""
          echo "=== IVE Test Results ==="
          grep -E 'PASS|FAIL|Result' ive-output.txt

          # Verify all 19 tests passed
          if grep -q "Result: 19/19 passed" ive-output.txt; then
            echo "=== All IVE tests passed ==="
          else
            echo "=== IVE test FAILURE ==="
            exit 1
          fi

      - name: Upload IVE test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ive-test-log
          path: ive-output.txt
          retention-days: 7

  sofia-isp:
    name: Sofia ISP regression (hi3516ev200, sc2315e)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfdt1 libglib2.0-0 libpixman-1-0 libslirp0 dnsmasq-base curl

      - name: Download QEMU binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/

      - name: Make QEMU executable
        run: chmod +x qemu-src/build/qemu-system-arm

      - name: Download EV200 firmware
        run: |
          cd qemu-boot
          curl -sL "https://github.com/OpenIPC/firmware/releases/download/latest/openipc.hi3516ev200-nor-lite.tgz" \
              -o openipc.hi3516ev200-nor-lite.tgz
          tar xzf openipc.hi3516ev200-nor-lite.tgz

      - name: Run Sofia ISP regression test
        timeout-minutes: 5
        env:
          # Tag of the qemu-hisilicon GitHub release that holds the
          # Sofia binary, fonts, and isp-profile fixtures.  Bump when
          # republishing.
          FIXTURES_TAG: sofia-fixtures-v1
          FIXTURES_REPO: ${{ github.repository }}
          ISP_READY_TIMEOUT: 45
          QEMU_TIMEOUT: 240
        run: |
          bash qemu-boot/sofia-isp-ci-test.sh

      - name: Upload Sofia test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofia-isp-log
          path: |
            /tmp/sofia-ci-*/qemu-output.txt
            /tmp/sofia-ci-*/qemu-debug.log
            /tmp/sofia-ci-*/http.log
          retention-days: 7

  maskrom-av300:
    name: AV300 mask-ROM end-to-end (-bios re.elf)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfdt1 libglib2.0-0 libpixman-1-0 libslirp0 \
            gcc-arm-none-eabi make

      - name: Download QEMU binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/

      - name: Make QEMU executable
        run: chmod +x qemu-src/build/qemu-system-arm

      - name: Checkout openhisilicon (bootrom RE source)
        uses: actions/checkout@v4
        with:
          repository: openipc/openhisilicon
          path: openhisilicon

      - name: Build hi3516av300 mask-ROM re.elf
        run: |
          make -C openhisilicon/bootrom/hi3516av300 build
          test -f openhisilicon/bootrom/hi3516av300/re.elf
          ls -la openhisilicon/bootrom/hi3516av300/re.elf

      - name: Verify mask-ROM handshake emission (no host reply)
        timeout-minutes: 2
        # Without a 0xAA reply, the bootrom resets in a loop. Each
        # uart0_wait_start_frame call emits 25× 0x20 then 0x0a (one full
        # handshake cycle = 26 bytes). The first 26 bytes must match the
        # exact handshake pattern — that asserts the full chain
        # _entry → main → fastboot_update → burn_bootloader →
        # uart0_wait_start_frame → uart0_write(0x20) ran verbatim from
        # our reverse-engineered source.
        #
        # Capture via file-backed chardev rather than -serial stdio.
        # stdio is block-buffered when stdout is redirected to a file
        # (CI case, not a TTY), so a slow CI runner that emits only
        # ~30 bytes before SIGTERM never flushes the 4 KiB stdio buffer
        # and we see 0 bytes.  -serial file:... writes directly with no
        # libc buffering.
        run: |
          timeout 20 ./qemu-src/build/qemu-system-arm \
              -M hi3516av300 \
              -bios openhisilicon/bootrom/hi3516av300/re.elf \
              -display none -monitor none \
              -serial file:/tmp/uart-handshake.bin \
              -serial null -serial null \
              2>/tmp/qemu-handshake.log || true

          bytes=$(stat -c%s /tmp/uart-handshake.bin)
          echo "captured: $bytes bytes"
          if [ "$bytes" -lt 26 ]; then
            echo "FAIL: too few UART bytes — bootrom did not reach uart0_write"
            echo "--- qemu stderr ---"
            cat /tmp/qemu-handshake.log
            echo "--- first 64 captured bytes (if any) ---"
            xxd /tmp/uart-handshake.bin
            exit 1
          fi
          head=$(head -c 26 /tmp/uart-handshake.bin | xxd -p | tr -d '\n')
          # One handshake cycle = 5 outer × 5 inner = 25× uart0_write(0x20)
          # followed by uart0_write('\n').  26 bytes total = 52 hex chars.
          expected="202020202020202020202020202020202020202020202020200a"
          if [ "${head}" != "${expected}" ]; then
            echo "FAIL: first 26 bytes don't match handshake pattern"
            echo "got:      ${head}"
            echo "expected: ${expected}"
            xxd /tmp/uart-handshake.bin | head -5
            exit 1
          fi
          echo "PASS: bootrom emitted 25× 0x20 + 0x0a handshake pattern"

      - name: Verify mask-ROM advances past handshake on 0xAA reply
        timeout-minutes: 2
        # Reply 0xAA mid-handshake.  uart0_wait_start_frame returns 1,
        # burn_bootloader writes SC_RECOVERY=1 and enters
        # uart0_recv_payload — which sits silently waiting for frames.
        #
        # The bootrom's RX FIFO is flushed at the START of every
        # uart0_wait_start_frame call (via uart0_flush_rx_fifo()).
        # So an ACK delivered BEFORE the bootrom reaches that function
        # gets discarded; it only counts if it arrives DURING the
        # emit window (between flush and the brief poll moments).
        # Wall-clock-based timing is therefore fragile across CI
        # speeds — we use event-driven sending instead: as soon as we
        # see the first 0x20 emission byte, the bootrom is mid-emit
        # past the flush, and the next handful of bytes we send will
        # land in the FIFO during the active poll window.
        run: |
          ./qemu-src/build/qemu-system-arm \
              -M hi3516av300 \
              -bios openhisilicon/bootrom/hi3516av300/re.elf \
              -display none -monitor none \
              -chardev socket,id=uart0,path=/tmp/uart.sock,server=on,wait=on \
              -serial chardev:uart0 \
              -serial null -serial null \
              2>/tmp/qemu-recv.log &
          QEMU_PID=$!
          for i in $(seq 1 20); do [ -S /tmp/uart.sock ] && break; sleep 0.5; done
          if ! [ -S /tmp/uart.sock ]; then
            echo "FAIL: qemu socket never appeared"
            cat /tmp/qemu-recv.log
            exit 1
          fi

          python3 - <<'PY'
          import socket, time, select, sys
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect('/tmp/uart.sock')
          s.setblocking(False)

          # Wait up to 30 s for the first 0x20 handshake byte — that
          # tells us the bootrom has just passed flush_rx_fifo and is
          # in the emit-and-poll phase of uart0_wait_start_frame.
          pre = bytearray()
          saw_emit = False
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              r, _, _ = select.select([s], [], [], 0.05)
              if r:
                  try:
                      c = s.recv(4096)
                  except (BlockingIOError, ConnectionError):
                      continue
                  if c:
                      pre.extend(c)
                      if 0x20 in c:
                          saw_emit = True
                          break

          if not saw_emit:
              print(f"FAIL: never saw a 0x20 byte in {len(pre)} bytes")
              sys.exit(1)

          # Burst 0xAA over 200 ms — covers multiple poll moments in
          # the current emit window plus a bit of slack.
          for _ in range(40):
              try: s.send(b'\xaa')
              except (BlockingIOError, ConnectionError): pass
              time.sleep(0.005)

          # Drain any inflight emission for ~1 s.
          time.sleep(1)
          while True:
              r, _, _ = select.select([s], [], [], 0.05)
              if not r: break
              try:
                  c = s.recv(4096)
              except (BlockingIOError, ConnectionError):
                  break
              if not c: break
              pre.extend(c)

          # Post-ACK silence window.  If bootrom consumed the ACK and
          # entered uart0_recv_payload, it stays silent regardless of
          # CI speed.
          post = bytearray()
          end = time.monotonic() + 3
          while time.monotonic() < end:
              r, _, _ = select.select([s], [], [], 0.1)
              if r:
                  try:
                      c = s.recv(4096)
                  except (BlockingIOError, ConnectionError):
                      break
                  if c: post.extend(c)

          open('/tmp/uart-pre.bin', 'wb').write(pre)
          open('/tmp/uart-post.bin', 'wb').write(post)
          print(f"pre+inflight: {len(pre)} bytes")
          print(f"post-ACK 3s:  {len(post)} bytes")
          if len(post) >= 26:
              print("FAIL: bootrom kept emitting handshakes after 0xAA")
              sys.exit(1)
          print("PASS: bootrom consumed 0xAA, advanced into uart0_recv_payload")
          PY

          kill $QEMU_PID 2>/dev/null; wait $QEMU_PID 2>/dev/null || true

      - name: Upload mask-ROM test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maskrom-av300-log
          path: |
            /tmp/uart-handshake.bin
            /tmp/uart-pre.bin
            /tmp/uart-post.bin
            /tmp/qemu-handshake.log
            /tmp/qemu-recv.log
            openhisilicon/bootrom/hi3516av300/re.elf
          retention-days: 7

  boot:
    name: Boot ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # mem/kernel_mem_mb/MMZ layout now lives in HisiSoCConfig; no -m
          # override here so CI exercises the same defaults as the run
          # scripts and real users.
          - name: hi3516cv100
            soc: hi3516cv100
            machine: hi3516cv100
            append: "console=ttyAMA0,115200 root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),2048k(kernel),5120k(rootfs),-(rootfs_data)"
            ping_linux: true
            uboot_bin: u-boot-hi3516cv100-universal.bin

          - name: hi3516cv200
            soc: hi3516cv200
            machine: hi3516cv200
            append: "console=ttyAMA0,115200 root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),3072k(kernel),10240k(rootfs),-(rootfs_data)"
            ping_linux: true
            uboot_bin: u-boot-hi3516cv200-universal.bin
            flash_mem: 256M

          - name: hi3516av100
            soc: hi3516av100
            machine: hi3516av100
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),3072k(kernel),10240k(rootfs),-(rootfs_data)"
            ping_linux: true
            uboot_bin: u-boot-hi3516av100-universal.bin

          - name: hi3516cv300
            soc: hi3516cv300
            machine: hi3516cv300
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),3072k(kernel),10240k(rootfs),-(rootfs_data)"
            ping_linux: true
            uboot_bin: u-boot-hi3516cv300-universal.bin
            flash_mem: 256M

          # The 1M sibling of cv300: same die and map, 64 MiB, SCSYSID0
          # variant byte 4.
          - name: hi3516ev100
            soc: hi3516ev100
            machine: hi3516ev100
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),3072k(kernel),10240k(rootfs),-(rootfs_data)"
            ping_linux: true
            uboot_bin: u-boot-hi3516ev100-universal.bin

          # cv500 family covers av300 (same die, av300 is variant id 5);
          # one Linux + U-Boot gate exercises both.  flash_mem=1G because
          # the OpenIPC cv500 U-Boot is built assuming the platform-max
          # 1 GiB DDR and relocates itself to top-of-RAM (~0xBFEE2000).
          # The default 128 MiB ram_size leaves that target unmapped,
          # the relocation jump faults, and the CPU resets in a loop.
          - name: hi3516cv500
            soc: hi3516cv500
            machine: hi3516cv500
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),3072k(kernel),10240k(rootfs),-(rootfs_data)"
            # Dual Cortex-A7: CPU1 released through CRG REG_CPU_SRST_CRG (#34)
            smp: 2
            ping_linux: true
            uboot_bin: u-boot-hi3516cv500-universal.bin
            flash_mem: 1G

          - name: hi3519v101
            soc: hi3519v101
            machine: hi3519v101
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),3072k(kernel),10240k(rootfs),-(rootfs_data)"
            ping_linux: true
            uboot_bin: u-boot-hi3519v101-universal.bin

          - name: hi3516ev300
            soc: hi3516ev300
            # sensor=none skips the SoC-default IMX335 attach so OpenIPC's
            # /usr/sbin/load_hisilicon does not insmod the vendor MPP blob
            # (which segfaults on QEMU and prevents reaching login).
            machine: hi3516ev300,sensor=none
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs mtdparts=hi_sfc:256k(boot),64k(env),3072k(kernel),10240k(rootfs),-(rootfs_data)"
            ping_linux: true
            uboot_bin: u-boot-hi3516ev300-universal.bin
            flash_mem: 128M
            # Exercise the HiFMC NOR erase+program path from Linux userspace
            # (flash_eraseall + flashcp -v). Guards the erase-address/WEL fix
            # that OpenIPC firstboot & sysupgrade depend on. ev300 stands in
            # for all hisi-fmc SoCs (the fix is in shared hisi-fmc.c).
            flash_rw: true

          # gk7205v500 (Goke V500) full-Linux boot regression gate.
          # The goke V500 OpenIPC kernel uses an "xmsp804" timer
          # (4 single-timer blocks at 0x100 stride, hisi-xmsp804.c);
          # before the fix Linux hung at "Calibrating delay loop" because
          # the periodic timer IRQ at block1 (0x12000100, GIC SPI 27) was
          # never delivered.  Plain console=ttyAMA0 (no earlycon) suffices
          # once the timer IRQ works.  Stands in for the whole V500 family
          # (gk7205v510/v530, gk7202v330 share the xmsp804 wiring).
          - name: gk7205v500
            soc: gk7205v500
            machine: gk7205v500,sensor=none
            append: "console=ttyAMA0,115200 root=/dev/ram0 rootfstype=squashfs"

          # hi3516cv610 (V5) has its own boot-hi3516cv610 job below: its
          # OpenIPC release is a combined firmware.bin (FIT kernel+dtb with an
          # appended SquashFS) under the SoC-family name, so it needs an
          # extraction step and doesn't fit this download/boot matrix.

          # NVR/DVR family — OpenIPC ships nor-lite firmware (kernel +
          # rootfs) and u-boot-${soc}-universal.bin for 3 SoCs:
          # hi3520dv200, hi3536cv100, hi3536dv100.  Linux boot test runs
          # for all three; all three also run the full U-Boot ping path
          # (parallel to hi3516av100, openhisilicon#59 / #74).  See the
          # per-SoC notes in qemu/hw/arm/hisilicon.c for which Ethernet
          # controller each instantiates (hieth-sf, femac, gmac).
          - name: hi3520dv200
            soc: hi3520dv200
            machine: hi3520dv200
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs"
            ping_linux: true
            uboot_bin: u-boot-hi3520dv200-universal.bin

          - name: hi3536cv100
            soc: hi3536cv100
            machine: hi3536cv100
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs"
            uboot_bin: u-boot-hi3536cv100-universal.bin

          - name: hi3536dv100
            soc: hi3536dv100
            machine: hi3536dv100
            append: "console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs"
            ping_linux: true
            uboot_bin: u-boot-hi3536dv100-universal.bin

          # Xiongmai XM510 (hw/arm/xiongmai.c): the vendor 3.0.101 kernel on a
          # PL190 VIC, SP804, xmsfc NOR and the xmmac DWMAC 10/100.  No
          # uboot_bin -- OpenIPC publishes no XM U-Boot.  flash_rw runs the
          # xmsfc erase/program path on an 8 MiB NOR, the only size the
          # XM510 kernel's chip table knows.
          # mem= first, as U-Boot passes it: load_xiongmai sizes MMZ from the
          # first argument, and without it lays MMZ over the whole kernel.
          # Since the media blocks are modelled, VI and the H1 really write
          # those buffers, and the guest dies or corrupts its overlay.
          # mem=20M rather than the board's 18M: the -initrd boot needs it
          # (QEMU loads the initrd at 16 MiB, half of RAM), and at 18M
          # `sysupgrade --archive` refuses on silicon too, with no room in
          # /tmp to unpack it.  test-xm-stream.sh runs the board's 18M.
          - name: xm510
            soc: xm510
            machine: xm510
            append: "mem=20M console=ttyAMA0,115200 root=/dev/ram0 rootfstype=squashfs mtdparts=xm_sfc:256k(boot),64k(env),2048k(kernel),5120k(rootfs),-(rootfs_data)"
            ping_linux: true
            flash_rw: true
            flash_rw_mem: 32M
            mtd_name: xm_sfc
            flash_mb: 8
            cmdline_prefix: "mem=20M"
            # sysupgrade, firstboot and the firmware#2613 overlay case, on the
            # 32 MB board where sysupgrade's RAM phase is tightest.
            flash_tests: true
            overlay_keep: true
            # Last xm510 kernel without jffs2 xattrs (before firmware#2606).
            overlay_keep_kernel: nightly-20261015-1d9c834
            stream_test: true

          # Xiongmai XM530 (hw/arm/xiongmai.c): dual Cortex-A5 MPCore (A9
          # stand-in, GIC, TWD, PL310), xmsfc v2, DWMAC at 0x10010000.  CPU1
          # comes up through REG_SC_REMAP + REG_CPU1_SOFT_RST as on silicon.
          #
          # The flash tests put mem= FIRST (cmdline_prefix), as OpenIPC's
          # U-Boot passes it: load_xiongmai sizes MMZ from the first
          # argument, and without it lays MMZ over all of RAM, majestic
          # Oopses in mmz, never stops the xm_wdt the same script started,
          # and the guest resets a minute later.  Not on the -initrd boot
          # above: QEMU loads the initrd high in RAM, past a mem=32M kernel.
          - name: xm530
            soc: xm530
            machine: xm530
            smp: 2
            append: "console=ttyAMA0,115200 root=/dev/ram0 rootfstype=squashfs mtdparts=xm_sfc:256k(boot),64k(env),2048k(kernel),5120k(rootfs),-(rootfs_data)"
            ping_linux: true
            flash_rw: true
            flash_rw_mem: 64M
            mtd_name: xm_sfc
            flash_mb: 8
            cmdline_prefix: "mem=32M"
            flash_tests: true
            stream_test: true

          # XM550 is the XM530 die with 128 MB; OpenIPC ships it the xm530
          # image, so this boots that bundle on the 128 MB machine.
          - name: xm550
            soc: xm530
            machine: xm550
            smp: 2
            append: "console=ttyAMA0,115200 root=/dev/ram0 rootfstype=squashfs mtdparts=xm_sfc:256k(boot),64k(env),2048k(kernel),5120k(rootfs),-(rootfs_data)"

    continue-on-error: ${{ matrix.allow_failure == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfdt1 libglib2.0-0 libpixman-1-0 libslirp0 dnsmasq-base

      - name: Download QEMU binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/

      - name: Make QEMU executable
        run: chmod +x qemu-src/build/qemu-system-arm

      - name: Setup TAP network
        if: matrix.ping_linux || matrix.uboot_bin
        run: |
          sudo ip tuntap add dev tap0 mode tap user $(whoami)
          sudo ip link add qbr0 type bridge
          sudo ip link set qbr0 type bridge stp_state 0
          sudo ip link set tap0 master qbr0
          sudo ip link set qbr0 up
          sudo ip link set tap0 up
          sudo ip addr add 10.0.10.1/24 dev qbr0
          # Second host address, off the guest's subnet on purpose: it is
          # advertised as the guest's DNS server, so a query only reaches us if
          # the guest installed and used the default route we handed it.
          sudo ip addr add 10.0.20.1/24 dev qbr0
          sudo iptables -I INPUT -i qbr0 -j ACCEPT
          # HTTP server for TCP connectivity test (validates TX checksum offload)
          python3 -m http.server 8080 --bind 10.0.10.1 &
          # dnsmasq: DHCP + DNS forwarder on the bridge
          sudo dnsmasq --interface=qbr0 --bind-interfaces \
            --listen-address=10.0.10.1 --listen-address=10.0.20.1 \
            --dhcp-range=10.0.10.50,10.0.10.99,255.255.255.0,1h \
            --dhcp-option=3,10.0.10.1 --dhcp-option=6,10.0.20.1 \
            --no-resolv --server=8.8.8.8 \
            --no-daemon --log-dhcp --log-queries \
            --log-facility=/tmp/dnsmasq-ci.log \
            --pid-file=/tmp/dnsmasq.pid &
          sleep 1
          # The network check reads the lease and the guest's DNS queries out
          # of this log instead of driving a shell in the guest.
          sudo touch /tmp/dnsmasq-ci.log && sudo chmod 0644 /tmp/dnsmasq-ci.log

      - name: Download firmware
        run: |
          cd qemu-boot
          curl -sL "https://github.com/OpenIPC/firmware/releases/download/latest/openipc.${{ matrix.soc }}-nor-lite.tgz" \
              -o "openipc.${{ matrix.soc }}-nor-lite.tgz"
          tar xzf "openipc.${{ matrix.soc }}-nor-lite.tgz"

      - name: "OpenIPC kernel + rootfs boot"
        timeout-minutes: 3
        run: |
          # All SoCs now reach login in <30 s with the default memory
          # layout from HisiSoCConfig (measured: CV100 ~20 s, CV200
          # ~18 s, AV100 ~15 s, CV300/CV500/3519V101 <30 s, EV300 ~7 s).
          # 120 s gives us a 4× margin over the measured worst case.
          #
          # `-nic user,restrict=on` keeps SLIRP's internal DHCP server
          # reachable (udhcpc still gets 10.0.2.15) but blocks all
          # outbound traffic.  Required because busybox ntpd in OpenIPC
          # uses a strict 0.5 ms STEP_PEER_MAX delay threshold; on
          # GitHub-hosted runners the NAT path adds >5 ms latency,
          # ntpd rejects every reply and loops past the 120 s deadline.
          # See openhisilicon#104.  With restrict=on the NTP pool DNS
          # lookups fail fast, ntpd exits, S49ntp returns "OK", and
          # the rest of init runs deterministically.
          QEMU=./qemu-src/build/qemu-system-arm
          timeout 120 $QEMU \
            -M ${{ matrix.machine }} -smp ${{ matrix.smp || 1 }} \
            -kernel "qemu-boot/uImage.${{ matrix.soc }}" \
            -initrd "qemu-boot/rootfs.squashfs.${{ matrix.soc }}" \
            -nographic -serial mon:stdio \
            -nic user,restrict=on \
            -append '${{ matrix.append }}' \
            -d unimp,guest_errors -D qemu-boot/qemu.log \
            2>&1 | tee boot-output.txt &
          QEMU_PID=$!

          # Wait for login prompt
          for i in $(seq 1 120); do
            if grep -qE "login:|#\s*$" boot-output.txt 2>/dev/null; then
              echo ""
              echo "=== Boot successful: login prompt reached ==="
              kill $QEMU_PID 2>/dev/null || true

              # Regression: openhisilicon#66 — Wrong chip-id: hiunknown.
              # Caused by hisi-sysctl returning the packed 32-bit chip ID
              # at SCSYSID0 for V1/V2/V2A/V3/V3A SoCs that use a byte
              # layout on real silicon. Boot reaching login is not
              # enough — the firmware's chip-id check must succeed too,
              # otherwise load_hisilicon short-circuits before any
              # vendor module loads.
              if grep -qE "Wrong chip-id|hiunknown" boot-output.txt; then
                echo "=== FAIL: chip-id detection broken (openhisilicon#66) ==="
                grep -nE "Wrong chip-id|hiunknown" boot-output.txt
                exit 1
              fi
              echo "=== Chip-id detection OK ==="

              # Regression: #34 — secondary CPUs must come online, not
              # time out and leave the kernel on CPU0 alone.
              SMP=${{ matrix.smp || 1 }}
              if [ "$SMP" -gt 1 ]; then
                if grep -q "failed to come online" boot-output.txt ||
                   ! grep -q "Brought up $SMP CPUs" boot-output.txt; then
                  echo "=== FAIL: SMP bringup broken (#34) ==="
                  grep -nE "CPU[0-9]+:|Brought up" boot-output.txt
                  exit 1
                fi
                echo "=== SMP bringup OK: $SMP CPUs ==="
              fi
              exit 0
            fi
            sleep 1
          done

          echo "=== TIMEOUT: login prompt not reached ==="
          echo "--- Last 30 lines of output ---"
          tail -30 boot-output.txt
          kill $QEMU_PID 2>/dev/null || true
          exit 1

      - name: "Guest reboot boots the kernel again"
        timeout-minutes: 4
        run: |
          # init=/bin/false: PID 1 exits, the kernel panics, and panic=1
          # sends it through its restart handler a second later (SC_SYSRES
          # on every matrix SoC).  A second "Linux version" banner proves
          # the whole reset path: the guest's restart code reaches
          # SC_SYSRES (hi3516cv100's tcm_slow_reset), QEMU resets, and the
          # rebooted kernel gets far enough to print (the vendor GIC
          # driver's GDIF flag at sysctrl+0x130 must not survive reset).
          # 3.x kernels that ignore a missing init= still exec /bin/false.
          QEMU=./qemu-src/build/qemu-system-arm
          : > reboot-output.txt
          timeout 180 $QEMU \
            -M ${{ matrix.machine }} -smp ${{ matrix.smp || 1 }} \
            -kernel "qemu-boot/uImage.${{ matrix.soc }}" \
            -initrd "qemu-boot/rootfs.squashfs.${{ matrix.soc }}" \
            -nographic -serial file:reboot-output.txt -monitor none \
            -nic user,restrict=on \
            -append '${{ matrix.append }} init=/bin/false panic=1' \
            -d unimp,guest_errors -D qemu-boot/qemu-reboot.log &
          QEMU_PID=$!

          for i in $(seq 1 170); do
            if [ "$(grep -c 'Linux version' reboot-output.txt 2>/dev/null)" -ge 2 ]; then
              kill $QEMU_PID 2>/dev/null || true
              echo "=== Reboot OK: kernel booted a second time after ${i} s ==="
              exit 0
            fi
            sleep 1
          done

          kill $QEMU_PID 2>/dev/null || true
          echo "=== FAIL: no second boot after the guest restarted ==="
          grep -c SC_SYSRES qemu-boot/qemu-reboot.log || true
          echo "--- Last 30 lines of output ---"
          tail -30 reboot-output.txt
          exit 1

      - name: "Guest clock runs at wall-clock speed"
        timeout-minutes: 5
        # The login prompt appears even when the guest timebase disagrees
        # with the rate the DTB gives the kernel (SP804 vs clk_3m, generic
        # timer vs arm,armv7-timer clock-frequency), so assert it directly:
        # init=/bin/sh, /proc/uptime sampled 20 s of host time apart.
        run: |
          python3 qemu-boot/test-guest-clock.py \
            --qemu ./qemu-src/build/qemu-system-arm \
            --machine "${{ matrix.machine }}" \
            --smp ${{ matrix.smp || 1 }} \
            --kernel "qemu-boot/uImage.${{ matrix.soc }}" \
            --initrd "qemu-boot/rootfs.squashfs.${{ matrix.soc }}" \
            --log "qemu-boot/guest-clock-${{ matrix.soc }}.log"

      - name: "SPI-NOR erase/program round-trip"
        if: matrix.flash_rw
        timeout-minutes: 8
        run: |
          bash qemu-boot/test-flash-rw.sh \
            --soc "${{ matrix.soc }}" \
            --machine "${{ matrix.machine }}" \
            --qemu ./qemu-src/build/qemu-system-arm \
            --output-dir "qemu-boot/flash-rw-${{ matrix.soc }}" \
            --mem "${{ matrix.flash_rw_mem || '128M' }}" \
            --mtd-name "${{ matrix.mtd_name || 'hi_sfc' }}" \
            --flash-mb "${{ matrix.flash_mb || 16 }}" \
            --cmdline-prefix "${{ matrix.cmdline_prefix || '' }}" \
            --timeout 240

      # majestic, left to start on its own, must reach the H1 and produce
      # H.264 ffmpeg decodes: VI, the ISP's frame interrupts and the
      # encoder model together.  Judged from the dumped jobs, since the
      # camera stays unclaimed.
      - name: "majestic H.264 end to end"
        if: matrix.stream_test
        timeout-minutes: 6
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          bash qemu-boot/test-xm-stream.sh \
            --soc "${{ matrix.soc }}" --machine "${{ matrix.machine }}" \
            --qemu ./qemu-src/build/qemu-system-arm \
            --output-dir "$RUNNER_TEMP/stream-${{ matrix.soc }}"

      - name: "Flash-level firmware tests: dependencies"
        if: matrix.flash_tests
        run: sudo apt-get install -y --no-install-recommends mtd-utils attr squashfs-tools dosfstools

      - name: "sysupgrade from a local archive"
        if: matrix.flash_tests
        timeout-minutes: 12
        run: |
          bash qemu-boot/test-sysupgrade.sh \
            --soc "${{ matrix.soc }}" --machine "${{ matrix.machine }}" \
            --qemu ./qemu-src/build/qemu-system-arm \
            --output-dir "$RUNNER_TEMP/sysupgrade-${{ matrix.soc }}" \
            --mem "${{ matrix.flash_rw_mem || '128M' }}" \
            --mtd-name "${{ matrix.mtd_name || 'hi_sfc' }}" \
            --flash-mb "${{ matrix.flash_mb || 16 }}" \
            --cmdline-prefix "${{ matrix.cmdline_prefix || '' }}"

      - name: "firstboot wipes the overlay"
        if: matrix.flash_tests
        timeout-minutes: 10
        run: |
          bash qemu-boot/test-firstboot.sh \
            --soc "${{ matrix.soc }}" --machine "${{ matrix.machine }}" \
            --qemu ./qemu-src/build/qemu-system-arm \
            --output-dir "$RUNNER_TEMP/firstboot-${{ matrix.soc }}" \
            --mem "${{ matrix.flash_rw_mem || '128M' }}" \
            --mtd-name "${{ matrix.mtd_name || 'hi_sfc' }}" \
            --flash-mb "${{ matrix.flash_mb || 16 }}" \
            --cmdline-prefix "${{ matrix.cmdline_prefix || '' }}"

      - name: "init keeps an unmountable overlay that holds settings (firmware#2613)"
        # Only a kernel without jffs2 xattrs can refuse the overlay, so rows
        # opt in (overlay_keep: true); XM530's kernel has them.  Opt-in, not
        # "!= false": Actions compares a missing value equal to false.
        if: matrix.flash_tests && matrix.overlay_keep == true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        # The fix is OpenIPC/firmware 5c01f0a92.  Release images built before
        # it erase the overlay, which is the bug, not a reason to go red here:
        # run once the image under test carries the commit, which the build
        # SHA in its os-release says.
        run: |
          d=$(mktemp -d)
          unsquashfs -q -d "$d/r" "qemu-boot/rootfs.squashfs.${{ matrix.soc }}" usr/lib/os-release >/dev/null
          sha=$(sed -n 's/^BUILD_ID=.*-\([0-9a-f]\{7,\}\)$/\1/p' "$d/r/usr/lib/os-release")
          echo "image build: ${sha:-unknown}"
          [ -n "$sha" ] || { echo "::error::no build SHA in the image's os-release"; exit 1; }
          st=$(gh api "repos/OpenIPC/firmware/compare/5c01f0a92...${sha}" --jq .status) ||
            { echo "::error::cannot compare ${sha} with 5c01f0a92"; exit 1; }
          case "$st" in
            ahead|identical) ;;
            behind|diverged)
              echo "::notice::release image ${sha} does not contain firmware#2613 (compare: ${st}); skipped"
              exit 0 ;;
            *) echo "::error::unexpected compare status '${st}'"; exit 1 ;;
          esac
          # The scenario needs a kernel WITHOUT jffs2 xattrs meeting an
          # overlay written with them.  xm510 has had them since
          # firmware#2606, so the kernel comes from the last nightly before
          # that (matrix.overlay_keep_kernel), and the rootfs -- the thing
          # under test -- from the current release.  A pinned asset that has
          # gone is an error, not a skip: the coverage must not vanish quietly.
          kernel="qemu-boot/uImage.${{ matrix.soc }}"
          if [ -n "${{ matrix.overlay_keep_kernel }}" ]; then
            curl -fsSL "https://github.com/OpenIPC/firmware/releases/download/${{ matrix.overlay_keep_kernel }}/openipc.${{ matrix.soc }}-nor-lite.tgz" \
              -o "$d/pinned.tgz" ||
              { echo "::error::cannot fetch the pinned kernel from ${{ matrix.overlay_keep_kernel }}"; exit 1; }
            tar xzf "$d/pinned.tgz" -C "$d" "uImage.${{ matrix.soc }}"
            kernel="$d/uImage.${{ matrix.soc }}"
          fi
          bash qemu-boot/test-overlay-keep.sh \
            --soc "${{ matrix.soc }}" --machine "${{ matrix.machine }}" \
            --kernel "$kernel" \
            --qemu ./qemu-src/build/qemu-system-arm \
            --output-dir "$RUNNER_TEMP/overlay-keep-${{ matrix.soc }}" \
            --mem "${{ matrix.flash_rw_mem || '128M' }}" \
            --mtd-name "${{ matrix.mtd_name || 'hi_sfc' }}" \
            --flash-mb "${{ matrix.flash_mb || 16 }}" \
            --cmdline-prefix "${{ matrix.cmdline_prefix || '' }}"

      - name: "Linux network test"
        if: matrix.ping_linux
        timeout-minutes: 8
        # --ping-timeout is the wait for dropbear's banner on :22.  In
        # practice the banner only arrives once load_hisilicon finishes;
        # with guest time at wall-clock speed that is ~70 s after the DHCP
        # lease on hi3519v101 (its generic timer used to run 2.6x fast,
        # which hid the vendor modules' timed waits).  The loop exits on
        # the first banner, so the larger budget costs fast SoCs nothing.
        run: |
          bash qemu-boot/test-linux-network.sh \
            --soc "${{ matrix.soc }}" \
            --machine "${{ matrix.machine }}" \
            --append '${{ matrix.append }}' \
            --qemu ./qemu-src/build/qemu-system-arm \
            --tap tap0 \
            --host-ip 10.0.10.1 \
            --login-timeout 150 \
            --ping-timeout 150 \
            --curl-timeout 60 \
            --curl-max-time 90 \
            --dns-ip 10.0.20.1 \
            --dnsmasq-log /tmp/dnsmasq-ci.log \
            --output-dir "qemu-boot/linux-network-${{ matrix.soc }}"

      - name: "U-Boot ping test"
        if: matrix.uboot_bin
        timeout-minutes: 2
        run: |
          QEMU=./qemu-src/build/qemu-system-arm

          # Download U-Boot and build flash image
          curl -sL "https://github.com/OpenIPC/firmware/releases/download/latest/${{ matrix.uboot_bin }}" \
              -o /tmp/u-boot.bin
          FLASH=/tmp/flash.bin
          dd if=/dev/zero of=$FLASH bs=1M count=8 2>/dev/null
          dd if=/tmp/u-boot.bin of=$FLASH bs=1 conv=notrunc 2>/dev/null
          dd if=qemu-boot/uImage.${{ matrix.soc }} of=$FLASH bs=1 seek=$((0x50000)) conv=notrunc 2>/dev/null
          dd if=qemu-boot/rootfs.squashfs.${{ matrix.soc }} of=$FLASH bs=1 seek=$((0x350000)) conv=notrunc 2>/dev/null

          mkfifo /tmp/ub.in /tmp/ub.out
          # flash_mem overrides the machine-default ram size for
          # U-Boot flash-boot (some SoCs need more RAM than the
          # kernel-default to fit U-Boot + decompressed kernel).
          MEM_ARG=""
          if [ -n "${{ matrix.flash_mem }}" ]; then
            MEM_ARG="-m ${{ matrix.flash_mem }}"
          fi
          # `-M $machine,flash-file=$f` works regardless of which
          # underlying flash controller (hisi-fmc / hisi-sfc350) the
          # machine instantiates.  See openhisilicon#80.
          $QEMU \
            -M ${{ matrix.machine }},flash-file=$FLASH $MEM_ARG \
            -nographic -serial pipe:/tmp/ub -nic tap,ifname=tap0,script=no,downscript=no \
            -monitor none &
          QEMU_PID=$!
          cat /tmp/ub.out > /tmp/uboot-ping.txt &

          # Keep input pipe open (prevents EOF on each write)
          exec 3>/tmp/ub.in

          # Wait for U-Boot to start before sending interrupt — sending too
          # early fills the UART FIFO and characters get dropped
          for i in $(seq 1 30); do
            if grep -q "autoboot" /tmp/uboot-ping.txt 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          # Smoke-only mode: stop after the autoboot prompt, skip the network
          # half.  Reserved for SoCs whose U-Boot networking path doesn't
          # complete in QEMU even though U-Boot itself runs.  No DVR/NVR SoC
          # uses this currently; it's kept available for new bring-ups that
          # need to land the Linux gate before the network model is finished.
          SMOKE_ONLY="${{ matrix.uboot_smoke_only || 'false' }}"
          if [ "$SMOKE_ONLY" = "true" ]; then
            exec 3>&-
            kill $QEMU_PID 2>/dev/null || true
            wait 2>/dev/null || true
            rm -f /tmp/ub.in /tmp/ub.out

            echo ""
            if grep -q "autoboot" /tmp/uboot-ping.txt; then
              echo "=== PASS: U-Boot smoke (reached autoboot) ==="
            else
              echo "=== FAIL: U-Boot smoke (no autoboot prompt) ==="
              exit 1
            fi
            exit 0
          fi

          # Interrupt autoboot (spam Ctrl-C until we see the prompt)
          for i in $(seq 1 20); do
            printf '\x03' >&3
            if grep -q "OpenIPC #\|hisilicon #\|=> " /tmp/uboot-ping.txt 2>/dev/null; then
              break
            fi
            sleep 0.2
          done

          echo "setenv ipaddr 10.0.10.15" >&3
          echo "setenv serverip 10.0.10.1" >&3
          echo "setenv gatewayip 10.0.10.1" >&3
          echo "setenv netmask 255.255.255.0" >&3
          sleep 1
          # U-Boot's first ping right after PHY link-up frequently loses its
          # ARP (autoneg/host not ready) and its small fixed ARP-retry budget
          # is exhausted before the host replies.  Re-issue the ping until we
          # see a result, so a single dropped ARP doesn't fail the whole test.
          # (up to ~30s, mirroring the old single-send + 30s poll budget)
          for i in $(seq 1 10); do
            echo "ping 10.0.10.1" >&3
            for j in $(seq 1 3); do
              if grep -q "is alive" /tmp/uboot-ping.txt 2>/dev/null; then
                break 2
              fi
              sleep 1
            done
          done

          exec 3>&-
          kill $QEMU_PID 2>/dev/null || true
          wait 2>/dev/null || true
          rm -f /tmp/ub.in /tmp/ub.out

          echo ""
          if grep -q "is alive" /tmp/uboot-ping.txt; then
            echo "=== PASS: U-Boot ping ==="
          else
            echo "=== FAIL: U-Boot ping ==="
            exit 1
          fi

      - name: Teardown TAP network
        if: always() && (matrix.ping_linux || matrix.uboot_bin)
        run: |
          sudo kill $(cat /tmp/dnsmasq.pid) 2>/dev/null || true
          sudo iptables -D INPUT -i qbr0 -j ACCEPT 2>/dev/null || true
          sudo ip link del qbr0 2>/dev/null || true
          sudo ip tuntap del dev tap0 mode tap 2>/dev/null || true

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ matrix.name }}
          path: |
            boot-output.txt
            qemu-boot/qemu.log
            qemu-boot/linux-network-${{ matrix.soc }}
            qemu-boot/guest-clock-${{ matrix.soc }}.log
            /tmp/*-ping.txt
            /tmp/linux-network-summary.txt
          retention-days: 7

  # hi3516cv610 (V5).  Unlike the SoCs in the matrix above, OpenIPC ships
  # cv610 as a single firmware.bin under the SoC-family name "hi3516cv6xx",
  # "ultimate" variant: since OpenIPC/firmware#2638 the split NOR image (a
  # legacy uImage -- the zImage with its DTB appended -- then the SquashFS at
  # the next 64 KiB) in openipc.hi3516cv6xx-nor-ultimate-split.tgz; before it
  # a FIT holding the kernel + dtb with the SquashFS appended, in the plain
  # package.  Take whichever is published, split it into kernel(/dtb)/rootfs
  # and boot like qemu-boot/run-cv610.sh.
  # OpenIPC nt98562/nt98566 lite: the release kernel, with the device tree
  # the machine builds, to a PID-1 script that checks the vendor drivers
  # bound and reboots (RTC power-off with the wake alarm armed).  Not in the
  # boot matrix: that boots the SquashFS from a RAM disk, and this kernel
  # has none; flash boot is not modelled yet.
  boot-novatek:
    name: Boot ${{ matrix.soc }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        soc: [nt98562, nt98566]
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfdt1 libglib2.0-0 libpixman-1-0 libslirp0 squashfs-tools cpio

      - name: Download QEMU binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/

      - name: Make QEMU executable
        run: chmod +x qemu-src/build/qemu-system-arm

      - name: Download OpenIPC firmware
        run: |
          cd qemu-boot
          curl -sfL -o fw.tgz \
            "https://github.com/OpenIPC/firmware/releases/download/latest/openipc.${{ matrix.soc }}-nor-lite.tgz"
          tar xzf fw.tgz

      - name: Boot to PID 1 and reboot
        run: bash qemu-boot/test-novatek-boot.sh --soc ${{ matrix.soc }}

  boot-hi3516cv610:
    name: Boot hi3516cv610
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfdt1 libglib2.0-0 libpixman-1-0 libslirp0 u-boot-tools

      - name: Download QEMU binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/

      - name: Make QEMU executable
        run: chmod +x qemu-src/build/qemu-system-arm

      - name: Download and split OpenIPC firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd qemu-boot
          # The split package on latest, else the plain one; and when latest
          # has neither (between a format change and the nightly that
          # publishes the new one) the newest nightly-* release with either.
          fetch() {
            for name in openipc.hi3516cv6xx-nor-ultimate-split.tgz openipc.hi3516cv6xx-nor-ultimate.tgz; do
              curl -sfL "https://github.com/OpenIPC/firmware/releases/download/$1/$name" -o fw.tgz && return 0
            done
            return 1
          }
          if ! fetch latest; then
            for tag in $(gh release list -R OpenIPC/firmware --limit 30 --json tagName --jq '.[].tagName' | grep '^nightly-'); do
              fetch "$tag" && { echo "from $tag"; break; }
            done
          fi
          tar xzf fw.tgz
          FW=firmware.bin.hi3516cv6xx
          if [ "$(od -An -tx1 -N4 "$FW" | tr -d ' \n')" = 27051956 ]; then
            # Split image: the uImage (64-byte header + data, size big-endian
            # at byte 12), its DTB appended to the zImage inside, so no -dtb.
            set -- $(od -An -tu1 -j12 -N4 "$FW")
            head -c $(( 64 + (($1 << 24) | ($2 << 16) | ($3 << 8) | $4) )) "$FW" > uImage.hi3516cv610
          else
            # FIT: image 1 = linux_kernel (zImage), image 0 = fdt-1 (dtb).
            dumpimage -T flat_dt -p 1 -o uImage.hi3516cv610 "$FW"
            dumpimage -T flat_dt -p 0 -o cv610.dtb          "$FW"
          fi
          # SquashFS rootfs is appended right after the kernel.
          sqoff=$(grep -aboP 'hsqs' "$FW" | head -1 | cut -d: -f1)
          dd if="$FW" of=rootfs.squashfs.hi3516cv610 bs=64k iflag=skip_bytes \
              skip="$sqoff" status=none
          ls -la uImage.hi3516cv610 rootfs.squashfs.hi3516cv610 cv610.dtb 2>/dev/null || true

      - name: "OpenIPC kernel + rootfs boot"
        timeout-minutes: 4
        run: |
          # cv610's kernel is capped to 32 MiB by default (mmz claims the
          # rest); the "ultimate" rootfs ramdisk needs more, so pass mem=128M.
          QEMU=./qemu-src/build/qemu-system-arm
          timeout 150 $QEMU -M hi3516cv610 -m 256M \
            -kernel qemu-boot/uImage.hi3516cv610 \
            $( [ -f qemu-boot/cv610.dtb ] && echo -dtb qemu-boot/cv610.dtb ) \
            -initrd qemu-boot/rootfs.squashfs.hi3516cv610 \
            -nographic -serial mon:stdio -nic user,restrict=on \
            -append 'mem=128M console=ttyAMA0,115200 earlyprintk root=/dev/ram0 rootfstype=squashfs' \
            -d unimp,guest_errors -D qemu-boot/qemu.log 2>&1 | tee boot-output.txt &
          QEMU_PID=$!

          # Wait for the login prompt.
          for i in $(seq 1 150); do
            if grep -qE "login:" boot-output.txt 2>/dev/null; then
              echo ""
              echo "=== Boot successful: login prompt reached ==="
              kill $QEMU_PID 2>/dev/null || true
              if grep -qE "SQUASHFS error|Kernel panic|deadlocked" boot-output.txt; then
                echo "=== FAIL: squashfs corruption / kernel panic ==="
                grep -nE "SQUASHFS error|Kernel panic|deadlocked" boot-output.txt | head
                exit 1
              fi
              echo "=== Boot clean ==="
              exit 0
            fi
            if ! kill -0 $QEMU_PID 2>/dev/null; then
              echo "=== FAIL: QEMU exited before login ==="
              tail -30 boot-output.txt
              exit 1
            fi
            sleep 1
          done

          echo "=== TIMEOUT: login prompt not reached ==="
          tail -30 boot-output.txt
          kill $QEMU_PID 2>/dev/null || true
          exit 1

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-hi3516cv610
          path: |
            boot-output.txt
            qemu-boot/qemu.log
          retention-days: 7

  boot-hi3516ev300-nand:
    name: Boot hi3516ev300 (SPI-NAND / UBI)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfdt1 libglib2.0-0 libpixman-1-0 libslirp0

      - name: Download QEMU binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm
          path: qemu-src/build/

      - name: Make QEMU executable
        run: chmod +x qemu-src/build/qemu-system-arm

      - name: Assemble SPI-NAND image from OpenIPC ev300 NAND release
        run: bash qemu-boot/mk-ev300-nand.sh

      - name: "OpenIPC NAND/UBI flash-boot"
        timeout-minutes: 4
        run: |
          # Boots ENTIRELY from the emulated SPI-NAND (no -kernel): boot ROM ->
          # U-Boot (attaches UBI, ubifsloads /boot/fitImage from the UBIFS
          # rootfs) -> kernel -> UBIFS root.  nand-jedec/nand-oob-size present
          # the W25N01GV the OpenIPC ev300 U-Boot SPI-NAND id table knows.
          #
          # The gate is the NAND/UBI storage chain: root mounted as UBIFS from
          # the emulated NAND, then init mounting rootfs_data.  On first boot
          # rootfs_data is empty, so the kernel formats it — real erases and
          # page programs — after which the boot partition must still be
          # byte-identical to the U-Boot written there (an erase decoded to
          # the wrong block used to wipe it).
          QEMU=./qemu-src/build/qemu-system-arm
          timeout 180 $QEMU -M hi3516ev300,sensor=none,flash-file=qemu-boot/ev300-nand.img \
            -global hisi-fmc.nand-jedec=0xEFAA21 \
            -global hisi-fmc.nand-oob-size=64 \
            -nographic -serial mon:stdio -nic user,restrict=on \
            -d unimp,guest_errors -D qemu-boot/qemu.log 2>&1 | tee boot-output.txt &
          QEMU_PID=$!

          for i in $(seq 1 180); do
            if grep -q 'name "rootfs_data"' boot-output.txt 2>/dev/null; then
              echo ""
              echo "=== NAND -> UBI -> UBIFS root + rootfs_data mounted ==="
              kill $QEMU_PID 2>/dev/null || true
              sleep 1
              # The whole chain must have run, and cleanly.
              grep -q "Mounted root (ubifs filesystem)" boot-output.txt \
                || { echo "FAIL: root not mounted as UBIFS from NAND"; exit 1; }
              if grep -qE "Kernel panic|Unable to mount root|spi_flash_probe\(\) failed|UBIFS error" boot-output.txt; then
                echo "=== FAIL: panic / NAND-boot regression ==="
                grep -nE "Kernel panic|Unable to mount root|spi_flash_probe\(\) failed|UBIFS error" boot-output.txt | head
                exit 1
              fi
              UB=/tmp/ev300-nand-mk/u-boot-hi3516ev300-nand.bin
              cmp -n "$(stat -c %s "$UB")" "$UB" qemu-boot/ev300-nand.img \
                || { echo "FAIL: U-Boot in the NAND image was overwritten during boot"; exit 1; }
              echo "=== Boot clean (boot ROM -> U-Boot UBI -> fitImage -> UBIFS root -> rootfs_data), boot partition intact ==="
              exit 0
            fi
            if ! kill -0 $QEMU_PID 2>/dev/null; then
              echo "=== FAIL: QEMU exited before mounting rootfs_data ==="
              tail -40 boot-output.txt
              exit 1
            fi
            sleep 1
          done

          echo "=== TIMEOUT: rootfs_data not mounted from NAND/UBI ==="
          tail -40 boot-output.txt
          kill $QEMU_PID 2>/dev/null || true
          exit 1

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-hi3516ev300-nand
          path: |
            boot-output.txt
            qemu-boot/qemu.log
          retention-days: 7
